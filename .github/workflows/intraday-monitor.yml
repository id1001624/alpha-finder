name: Intraday Monitor

on:
  workflow_dispatch:
  schedule:
    # Cover both US summer and winter sessions in Taipei time.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 13,22 * * 1-5'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 14-21 * * 1-5'

concurrency:
  group: intraday-monitor
  cancel-in-progress: true

jobs:
  intraday-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      INTRADAY_ACTIVE_TIMEZONE: Asia/Taipei
      TURSO_ENABLED: "true"
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday engine once
        run: |
          python scripts/run_intraday_execution_engine.py --respect-active-window

      - name: Alert on workflow failure
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          webhook = str(os.getenv("DISCORD_WEBHOOK_URL", "")).strip()
          if not webhook:
            raise SystemExit(0)

          run_id = os.getenv("GITHUB_RUN_ID", "")
          repo = os.getenv("GITHUB_REPOSITORY", "")
          server_url = os.getenv("GITHUB_SERVER_URL", "https://github.com")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if run_id and repo else ""
          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          lines = [
            f"[Alpha Finder] ❌ Intraday workflow failure {now_utc}",
            f"repo={repo}",
            f"run_id={run_id}",
          ]
          if run_url:
            lines.append(f"run_url={run_url}")

          payload = {"content": "\\n".join(lines)[:1900]}
          requests.post(
            webhook,
            json=payload,
            headers={"Content-Type": "application/json", "User-Agent": "AlphaFinder/1.0"},
            timeout=20,
          )
          PY